name: Publish to GitHub Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm.pkg.github.com requires the package name to be scoped to the repo
      # owner; npmjs.org keeps the unscoped pi-airline. Only the name changes —
      # repository/keywords/pi fields stay, so the package links back to this repo.
      - name: Scope the package name for GitHub Packages
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@ziy1-tan/pi-airline';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF

      - name: Configure npm registry
        run: |
          cat > .npmrc <<'EOF'
          @ziy1-tan:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
