name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Trusted Publishing (OIDC): no NPM_TOKEN secret. npm exchanges the GitHub
# OIDC token for a short-lived publish credential and attaches provenance.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - name: Skip if version already published
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "pi-airline@$v" version >/dev/null 2>&1; then
            echo "pi-airline@$v already on npm, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Debug: print the OIDC claims npm matches against the trusted publisher
      # config (claims only, never the token itself).
      - name: Show OIDC claims
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$tok" | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ["repository","repository_owner","workflow_ref","job_workflow_ref","ref","event_name","environment"]},indent=2))'

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
